<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Connect Access Pages</title>
<style>body{font:17px system-ui;background:#071225;color:#e9f1ff;max-width:650px;margin:12vh auto;padding:24px}input,button{font:inherit;padding:12px;border-radius:8px;box-sizing:border-box}input{width:100%;margin:12px 0}button{background:#22b8dc;border:0}p{line-height:1.6}</style></head><body>
<h1>Connect Access Pages</h1><p>Request an enrollment API token from your service operator, then paste it here to connect this Home Assistant. The token is used once.</p>
<p>NHP Server address: <strong>SERVICE_ADDRESS</strong><br>Set this address on the app’s Configuration page before enrollment.</p>
<form><label for="token">Enrollment API token</label><input id="token" type="password" autocomplete="off" required><button>Connect</button></form><p id="status" role="status"></p>
<script>
const csrf='SETUP_CSRF';document.querySelector('form').onsubmit=async event=>{event.preventDefault();const field=document.querySelector('#token');const token=field.value;field.value='';document.querySelector('#status').textContent='Connecting…';try{const response=await fetch('setup/enroll',{method:'POST',headers:{'Content-Type':'application/json','X-Access-Pages-CSRF':csrf},body:JSON.stringify({enrollment_token:token})});if(!response.ok)throw Error();document.querySelector('#status').textContent='Enrolled. Preparing the secure guest endpoint…';}catch{document.querySelector('#status').textContent='Could not enroll. Check the token and NHP Server address, then try again.'}};
setInterval(async()=>{try{const response=await fetch('setup/status');const state=await response.json();document.querySelector('#status').textContent=state.message;if(state.ready)location.reload();}catch{}},3000);
</script></body></html>
