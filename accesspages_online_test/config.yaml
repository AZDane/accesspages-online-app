name: Access Pages Online test
slug: accesspages_online_test
description: Share selected sensors and lights through an OpenNHP Guest Gateway
version: 0.1.0-beta.12
stage: experimental
startup: application
boot: auto
init: false
arch:
  - amd64
  - aarch64
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_icon: mdi:shield-key-outline
options:
  server_address: nhp.beta.accesspages.app:62206
  device_mode: demo
  include_domains: ""
  include_areas: ""
  exclude_domains: "alarm_control_panel"
  exclude_entities: ""
schema:
  server_address: str
  device_mode: list(demo|homeassistant)
  include_domains: str?
  include_areas: str?
  exclude_domains: str?
  exclude_entities: str?
