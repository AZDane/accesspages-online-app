name: Private guest expiry check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-guest-expiry
  cancel-in-progress: false
jobs:
  expiry:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned browser dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/accesspages-browser-deps" --ignore-scripts --no-audit --no-fund --save-exact playwright@1.63.0
          "$RUNNER_TEMP/accesspages-browser-deps/node_modules/.bin/playwright" install --with-deps chrome
      - name: Verify natural session expiry and fresh admission
        env:
          NODE_PATH: ${{ runner.temp }}/accesspages-browser-deps/node_modules
          ACCESSPAGES_EXPIRY_INPUT: ${{ secrets.ACCESSPAGES_HOME_EXPIRY_INPUT }}
        run: node tests/check_guest_expiry.cjs
